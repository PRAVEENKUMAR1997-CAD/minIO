# MinIO S3 Platform - Legacy Image Override
# ==========================================
# OPTION C: Legacy minio/minio Docker Hub image
#
# WARNING: NOT RECOMMENDED FOR PRODUCTION
# ========================================
# The minio/minio Docker Hub repository may be archived.
# Use ONLY for local compatibility testing or specific legacy requirements.
#
# For production deployments, use:
#   - OPTION A: Build from source (docker-compose.yml)
#   - OPTION B: Docker Hardened Image (docker-compose.dhi.yml)
#
# Usage (testing only):
#   docker compose -f docker-compose.yml -f docker-compose.legacy.yml up -d

services:
  minio:
    # Override to use legacy Docker Hub image
    build: !reset null
    
    # PINNED VERSION - Never use 'latest' in production
    # Verify this version exists and is still available
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    
    # Legacy images run as root - documented limitation
    # user: root
