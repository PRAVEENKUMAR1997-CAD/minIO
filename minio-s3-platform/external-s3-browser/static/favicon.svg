<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="6" fill="#0a0e27"/>
  <!-- Vault base - hexagonal bucket shape -->
  <g filter="url(#glow)">
    <!-- Top hexagon face -->
    <polygon points="16,6 24,10 24,14 16,18 8,14 8,10" fill="none" stroke="url(#vaultGrad)" stroke-width="1.5"/>
    <!-- Left face -->
    <polygon points="8,10 8,22 16,26 16,18" fill="none" stroke="url(#vaultGrad)" stroke-width="1.2" opacity="0.7"/>
    <!-- Right face -->
    <polygon points="24,10 24,22 16,26 16,18" fill="none" stroke="url(#vaultGrad)" stroke-width="1.2" opacity="0.7"/>
    <!-- Inner glow accent -->
    <circle cx="16" cy="14" r="3" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
    <!-- Arrow pointing down -->
    <path d="M16,8 L16,13 M13,11 L16,14 L19,11" fill="none" stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
